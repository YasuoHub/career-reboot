<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>恢复已购报告｜重启图鉴</title>
<meta name="description" content="凭支付宝订单号恢复已购买的深度报告权益。" />
<meta name="robots" content="noindex,follow" />
<link rel="stylesheet" href="/css/guide.css" />
<style>
  .restore-box { max-width: 560px; margin: 40px auto; background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 26px; }
  .restore-box label { display: block; font-weight: 700; margin: 16px 0 6px; }
  .restore-box input { width: 100%; border: 1px solid #d9d3e8; border-radius: 10px; padding: 12px 14px; font-size: 16px; font-family: inherit; }
  .restore-box .btn { border: 0; cursor: pointer; margin-top: 16px; }
  .restore-msg { margin-top: 14px; font-size: 14px; line-height: 1.7; }
  .restore-msg.ok { color: var(--ok); }
  .restore-msg.err { color: #a33232; }
  .restore-help { font-size: 13px; color: var(--muted); margin-top: 18px; }
</style>
</head>
<body>
<header class="site-header"><div class="wrap">
  <a class="brand" href="/">重启<span>图鉴</span></a>
  <nav class="nav"><a href="/">返回首页</a><a href="/guide/">岗位图鉴</a><a href="/legal.html#privacy">隐私政策</a></nav>
</div></header>
<main class="wrap">
  <div class="restore-box">
    <span class="eyebrow">已购恢复</span>
    <h1 style="font-size:28px">凭订单号恢复深度报告</h1>
    <p class="muted">清除浏览器数据、换设备或超过本机保存期后，可用支付宝订单号重新核验并恢复权益。订单号以 <b>CRB</b> 开头，共 20 位。</p>
    <label for="order">支付宝订单号</label>
    <input id="order" inputmode="text" autocomplete="off" placeholder="例如 CRB17300000000001234" maxlength="24" />
    <button class="btn" id="btn-restore" type="button">核验并恢复</button>
    <div class="restore-msg" id="msg" role="status" aria-live="polite"></div>
    <p class="restore-help">找不到订单号？在支付宝 App →「我的」→「账单」里搜索「重启人格图鉴」或支付金额。若仍无法恢复，请通过 <a href="/legal.html#terms">用户协议</a> 页底部邮箱联系，附上支付时间与金额。</p>
  </div>
</main>
<footer class="footer"><div class="wrap">
  <p>「重启人格图鉴」不构成医疗、心理诊断、职业咨询或就业承诺。</p>
  <p><a href="/">首页 / 测评</a> · <a href="/guide/">岗位与城市图鉴</a> · <a href="/legal.html#terms">用户协议</a> · <a href="/legal.html#privacy">隐私政策</a></p>
</div></footer>
<script>
(function () {
  var btn = document.getElementById('btn-restore');
  var input = document.getElementById('order');
  var msg = document.getElementById('msg');

  function tokenExp(token) {
    try {
      var p = String(token).split('.')[0].replace(/-/g, '+').replace(/_/g, '/');
      var d = JSON.parse(atob(p));
      return Number(d.exp) || 0;
    } catch (e) { return 0; }
  }

  function setMsg(text, ok) {
    msg.textContent = text;
    msg.className = 'restore-msg ' + (ok ? 'ok' : 'err');
  }

  async function restore() {
    var order = String(input.value || '').trim().toUpperCase();
    if (!/^CRB\d{17}$/.test(order)) {
      setMsg('订单号格式不对：应以 CRB 开头，共 20 位。', false);
      return;
    }
    btn.disabled = true;
    btn.textContent = '正在核验…';
    setMsg('正在向支付宝核验订单，请稍候。', true);
    try {
      var res = await fetch('/api/alipay/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ outTradeNo: order })
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok || !data.paid || !data.token) {
        setMsg(data.status === 'WAIT_BUYER_PAY' ? '这笔订单还未支付，请完成支付后再试。' : '没有查到已支付的订单。请确认订单号与支付状态。', false);
        return;
      }
      var unlock = { token: data.token, exp: tokenExp(data.token), via: 'pay', outTradeNo: order };
      localStorage.setItem('rb_unlock', JSON.stringify(unlock));
      setMsg('已恢复权益。请返回首页重新完成一次测评，完成后即可查看深度报告。', true);
      var a = document.createElement('a');
      a.className = 'btn';
      a.href = '/';
      a.textContent = '返回首页 →';
      a.style.marginLeft = '10px';
      msg.appendChild(document.createElement('br'));
      msg.appendChild(a);
    } catch (e) {
      setMsg('核验失败，请检查网络后重试。', false);
    } finally {
      btn.disabled = false;
      btn.textContent = '核验并恢复';
    }
  }

  btn.addEventListener('click', restore);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') restore(); });
})();
</script>
</body>
</html>
