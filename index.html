<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>重启人格图鉴 · 测测失业后你适合重启成什么人</title>
  <meta name="description" content="失业、转行、空窗期，不是终点，是一次换挡的机会。16 道题，看看哪种活法最像下一个你。" />
  <meta property="og:title" content="重启人格图鉴 · 测测你是哪种重启人格" />
  <meta property="og:description" content="16 道题，约 96 秒，看清你在哪一种重启剧本里。作答默认只保存在本机。" />
  <meta property="og:image" content="/og-card.png" />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#0B0B14" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css?v=33" />
</head>
<body>
  <!-- Google Tag Manager：dataLayer 前置初始化，容器脚本紧随其后 -->
  <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-K83M334T"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
  </script>

  <!-- 首屏加载层（关键样式内联，主样式未就绪也安全；JS 侧有移除兜底） -->
  <div id="loader">
    <style>
      #loader{position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:#0b0b14;transition:opacity .45s}
      #loader.done{opacity:0;pointer-events:none}
      #loader .l-box{display:flex;flex-direction:column;align-items:center;gap:26px}
      #loader .l-title{font-family:'ZCOOL KuaiLe','PingFang SC','Microsoft YaHei',sans-serif;font-size:34px;color:#f4f2ff;letter-spacing:.08em}
      #loader .l-sub{font-size:11px;color:#a9a6c2;letter-spacing:.3em}
      #loader .l-bar{width:150px;height:3px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
      #loader .l-bar i{display:block;height:100%;width:38%;border-radius:99px;background:linear-gradient(90deg,#8b7bff,#5ad2e6);animation:lrun 1.05s ease-in-out infinite}
      @keyframes lrun{0%{transform:translateX(-115%)}100%{transform:translateX(290%)}}
    </style>
    <div class="l-box">
      <p class="l-title">重启人格图鉴</p>
      <div class="l-bar"><i></i></div>
      <p class="l-sub">CHECKING YOUR REBOOT KIT</p>
    </div>
  </div>

  <!-- 动态背景层 -->
  <div class="bg" aria-hidden="true">
    <div class="bg-blob b1"></div>
    <div class="bg-blob b2"></div>
    <div class="bg-blob b3"></div>
    <div class="bg-grain"></div>
  </div>

  <main id="app">

    <!-- ============ 封面 ============ -->
    <section id="sc-cover" class="screen active" aria-label="封面">
      <p class="cover-kicker">人生重启 · 人格图鉴 №01</p>
      <h1 class="cover-title">测测你的<br /><span class="grad">重启人格</span></h1>
      <p class="cover-sub">
        被裁、转行、裸辞、空窗——这些词听起来像终点，<br />
        其实只是给你的一次换挡机会。<br />
        <b>16 道题，约 96 秒</b>，看看哪种活法最像下一个你。
      </p>
      <button id="btn-start" class="btn btn-primary btn-lg">开始重启 <span class="arr">→</span></button>
      <p class="cover-stat">已 <b id="stat-total">--</b> 人完成过自己的重启</p>
      <p class="cover-last" id="cover-last" hidden>上一次的你：<b id="cover-last-name"></b></p>
      <p class="cover-legal">本测试为趣味性格探索，不构成医疗、心理诊断或就业承诺。结果仅供参考。<br /><a href="/legal.html#terms" target="_blank" rel="noopener">用户协议</a> · <a href="/legal.html#privacy" target="_blank" rel="noopener">隐私政策</a></p>
    </section>

    <!-- ============ 答题 ============ -->
    <section id="sc-quiz" class="screen" aria-label="答题中">
      <header class="quiz-top">
        <button id="btn-back" class="icon-btn" aria-label="返回首页">←</button>
        <ol id="progress-dots" class="dots" aria-hidden="true"></ol>
        <p class="quiz-stage" id="quiz-stage">第 1 / 8 弹</p>
      </header>
      <div id="q-panel" class="q-panel"><!-- 由 JS 渲染 --></div>
    </section>

    <!-- ============ 分析 ============ -->
    <section id="sc-computing" class="screen" aria-label="分析中">
      <div class="computing-box">
        <div class="ring"><div class="ring-inner"></div></div>
        <ul id="compute-lines" class="compute-lines"></ul>
      </div>
    </section>

    <!-- ============ 结果 ============ -->
    <section id="sc-result" class="screen" aria-label="结果">
      <div id="res-body" class="res-body"><!-- 由 JS 渲染 --></div>
    </section>

    <!-- ============ 深度报告 ============ -->
    <section id="sc-report" class="screen" aria-label="深度报告">
      <header class="report-top">
        <button id="report-back" class="icon-btn" aria-label="返回结果">←</button>
        <span class="report-title">深度报告</span>
      </header>
      <div id="report-body" class="report-body"><!-- 由 JS 渲染 --></div>
    </section>

  </main>

  <!-- ============ 海报弹窗 ============ -->
  <div id="poster-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="分享海报">
    <div class="modal-mask" data-close></div>
    <div class="modal-card">
      <img id="poster-img" alt="分享海报" />
      <p class="modal-hint">点「保存到相册」或<b>长按图片</b>均可存到手机</p>
      <div class="modal-btns">
        <button id="poster-download" class="btn btn-primary">保存到相册</button>
        <button id="poster-share" class="btn btn-ghost">复制链接</button>
      </div>
      <p class="link-copy" id="link-copy"></p>
    </div>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>

  <script src="./js/data.js?v=30"></script>
  <script src="./js/report.js?v=3"></script>
  <script src="./js/poster.js?v=30"></script>
  <script src="./js/app.js?v=35"></script>
</body>
</html>
